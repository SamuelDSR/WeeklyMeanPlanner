services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mealplanner
      POSTGRES_USER: mealplanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 只在数据目录为空（第一次启动）时会自动执行这个脚本建表
      - ./server/src/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealplanner -d mealplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mealplanner:${POSTGRES_PASSWORD}@postgres:5432/mealplanner
      JWT_SECRET: ${JWT_SECRET:?请在 .env 里设置一个随机字符串作为 JWT_SECRET}
      NODE_ENV: production
      PORT: 3000
      # 应用本身跑在你自己的 nginx 反向代理后面，nginx 负责 TLS 终止，
      # 这里 cookie 的 secure 标志设成 true，配合 nginx 转发 X-Forwarded-Proto 使用。
      # 想不经过 nginx、直接用 http 访问来调试时，在 .env 里设 COOKIE_SECURE=false
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # 管理员账号的邮箱：这个邮箱注册时会自动成为管理员并直接通过审核。
      # 留空的话，数据库里第一个注册的账号自动成为管理员。
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    volumes:
      - uploads:/app/uploads
    ports:
      # 绑哪个网卡由 BIND_ADDR 决定（.env 里设）：
      #   127.0.0.1  只给本机（默认）—— 前面有 nginx 反代时就用这个
      #   0.0.0.0    所有网卡 —— 局域网里其它设备（手机）能直接连
      #   192.168.x.y 只给某一个网卡
      # 注意：Docker 发布端口会自己写 iptables，ufw 挡不住它，
      # 所以 0.0.0.0 意味着这台机器所有网卡上都能连（家里局域网通常没问题，
      # 但如果这台机器还有公网 IP，就等于直接暴露在公网上）。
      - "${BIND_ADDR:-127.0.0.1}:8080:3000"

volumes:
  pgdata:
  uploads:
