# 这是你宿主机 nginx（不是 docker-compose 里的容器）应该加的 server 块示例
# 假设 docker-compose 已经把 api 服务发布在 127.0.0.1:8080（见 docker-compose.yml）
#
# 用法：把这段放进你现有的 nginx 配置（比如 /etc/nginx/sites-available/meal.xxx.fr），
# 建好软链接到 sites-enabled，然后 nginx -t && systemctl reload nginx
#
# 如果你用 certbot 管理证书，可以先用 http 版本跑通，再用
# `certbot --nginx -d meal.xxx.fr` 自动帮你加 https 和跳转

server {
    listen 80;
    server_name meal.xxx.fr;

    # 上传图片单张限制 8MB（跟后端 multer 的限制保持一致，避免大文件卡在 nginx 这层被拒绝）
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 转发真实客户端信息，后端用这些判断 https/记录访问日志
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

